services:
  - type: web
    name: grandstreetworks
    runtime: static
    buildCommand: ""
    staticPublishPath: .
    autoDeploy: true
    domains:
      - grandstreetworks.com
      - www.grandstreetworks.com
    routes:
      # Client sites under sites/ use relative asset paths so a folder can be
      # lifted onto its own domain unchanged. Without the trailing slash the
      # browser resolves assets/ against /sites/ and every image 404s, and
      # Render serves the slash-less URL as 200 rather than redirecting it.
      - type: redirect
        source: /sites/essential-fence-center
        destination: /sites/essential-fence-center/
      - type: redirect
        source: /sites/palm-construction
        destination: /sites/palm-construction/
      - type: redirect
        source: /sites/palm-construction-a
        destination: /sites/palm-construction-a/
      - type: redirect
        source: /sites/palm-construction-b
        destination: /sites/palm-construction-b/
      - type: redirect
        source: /sites/zach-becker-1
        destination: /sites/zach-becker-1/
      - type: redirect
        source: /sites/zach-becker-2
        destination: /sites/zach-becker-2/
      # The site was first published under a placeholder name; the old link
      # was shared, so it keeps working.
      - type: redirect
        source: /sites/northline-fence
        destination: /sites/essential-fence-center/
      - type: redirect
        source: /sites/northline-fence/*
        destination: /sites/essential-fence-center/

  # Intake endpoint behind /start/ on this site and on grandstreetai.com.
  # Zero dependencies, so there is nothing to install and the build is a
  # no-op. Deliberately NOT on the free plan: free services spin down after
  # inactivity and cold-start in roughly a minute, which on a form submit
  # means most real prospects would hit the mailto fallback instead of the
  # form working. Seven dollars a month is cheaper than that.
  - type: web
    name: grandstreetworks-intake
    runtime: node
    plan: starter
    rootDir: intake-api
    buildCommand: ""
    startCommand: node server.js
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      # Set in the Render dashboard, never here.
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM
        value: intake@send.grandstreetworks.com
      - key: MAIL_TO
        value: joe@grandstreetworks.com
      - key: INTAKE_LOG_PATH
        value: /var/data/intake.jsonl
    disk:
      # So there is a record of every submission that does not depend on a
      # mailbox. Small on purpose - one JSONL line per enquiry.
      name: intake-data
      mountPath: /var/data
      sizeGB: 1
