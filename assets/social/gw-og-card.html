<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  /* Open Graph / iMessage link-preview card for grandstreetworks.com.
     Same ground, dot and monogram as gw-pfp.html, composed for 1200×630. */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body { background: #050505; position: relative; font-family: 'JetBrains Mono', Menlo, Consolas, monospace; }
  .dot {
    position: absolute;
    left: 96px; top: 96px;
    width: 72px; height: 72px;
    background: #C2D57D;
    border-radius: 50%;
    box-shadow: 0 0 48px rgba(194, 213, 125, 0.5);
  }
  .gw {
    position: absolute;
    left: 96px;
    bottom: 196px;
    font-size: 220px;
    font-weight: 700;
    line-height: 1;
    color: #E5E5E6;
    letter-spacing: -0.02em;
  }
  .wordmark {
    position: absolute;
    left: 100px;
    bottom: 118px;
    font-size: 40px;
    font-weight: 400;
    color: #E5E5E6;
    letter-spacing: 0.01em;
  }
  .tagline {
    position: absolute;
    left: 100px;
    bottom: 64px;
    font-size: 26px;
    font-weight: 400;
    color: #8A8A8E;
  }
</style>
</head>
<body>
  <div class="dot"></div>
  <div class="gw">GW</div>
  <div class="wordmark">Grand Street Works</div>
  <div class="tagline">Websites &amp; native apps · Brooklyn, NY</div>
</body>
</html>
