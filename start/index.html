<!-- ===================================================================
     The intake diagnostic. Five questions, then a verdict that is allowed
     to be "you don't need us" — that branch is the reason the rest of it
     is believable. Ungated: the recommendation renders before anything is
     asked for, because the page it came from promises no obligation.

     The engine is start/intake.js and is shared verbatim with
     grandstreetai as a copy, not a link. Everything below in
     INTAKE_CONFIG is the only site-specific part.

     Submissions POST to the intake service (intake-api/ in this repo).
     If that endpoint is down the form degrades to a fully composed
     mailto rather than losing the lead.
     =================================================================== -->
<link rel="stylesheet" href="../styles.css">
<!-- Umami Cloud — privacy-first analytics. No cookies, so no consent banner.
     grandstreetworks.com and grandstreetai.com are separate Umami sites on
     separate IDs; this is the Works one, and the noindex trade pages under
     work/ report into it too. Deferred, ~2KB, and failure is silent — if it
     is blocked or down the page is unaffected. -->
<script defer src="https://cloud.umami.is/script.js" data-website-id="3107a636-a6b0-416f-bd27-8aaa29c8abc6"></script>
</head>

<body>

<header>
  <div class="logo-mark">
    <span class="status-dot" aria-hidden="true"></span>
    <a href="../" class="label" style="font-weight: 600;">Grand Street Works</a>
  </div>
  <nav class="site-nav">
    <a href="../#work" class="label">Work</a>
    <a href="../what-we-build/" class="label">What we build</a>
    <a href="mailto:joe@grandstreetworks.com?subject=Rebuild%20our%20homepage" class="label" style="text-decoration: underline;">Get in touch</a>
  </nav>
</header>

<main class="intake-shell">
  <div id="intake"></div>
  <noscript>
    <section class="intake-step">
      <h2>This one needs JavaScript.</h2>
      <p class="intake-help text-large">
        Email <a href="mailto:joe@grandstreetworks.com?subject=Rebuild%20our%20homepage" style="text-decoration:underline;">joe@grandstreetworks.com</a>
        with your website address and what you do. Same answer, one fewer step.
      </p>
    </section>
  </noscript>
</main>

<script>
window.INTAKE_CONFIG = (function () {

  /* The twenty trades are the same keys as the directories under work/,
     so the verdict can link someone straight at six homepages in their
     own trade. Adding a trade here means adding work/<value>/ too. */
  var TRADES = [
    ['personal-injury',      'Personal injury'],
    ['cosmetic-dentists',    'Cosmetic dentistry'],
    ['plastic-surgeons',     'Plastic surgery'],
    ['med-spas',             'Med spas'],
    ['dermatology',          'Dermatology'],
    ['roofing',              'Roofing'],
    ['hvac',                 'Heating & cooling'],
    ['restoration',          'Restoration'],
    ['general-contractors',  'General contracting'],
    ['luxury-real-estate',   'Luxury real estate'],
    ['wealth-management',    'Wealth management'],
    ['accounting-cpas',      'Accounting & CPAs'],
    ['architecture',         'Architecture'],
    ['interior-design',      'Interior design'],
    ['custom-home-builders', 'Custom home building'],
    ['pool-builders',        'Pool building'],
    ['solar',                'Solar'],
    ['recruiting',           'Recruiting'],
    ['property-management',  'Property management'],
    ['veterinary',           'Veterinary'],
    ['other',                'Something else']
  ];

  /* Trades where a meaningful part of the job happens away from a desk.
     Nudges the native-app score without ever being enough to win on
     its own — the work has to actually be described as broken first. */
  var FIELD_TRADES = [
    'roofing', 'hvac', 'restoration', 'general-contractors',
    'solar', 'pool-builders', 'property-management', 'custom-home-builders'
  ];

  function tradeLabel(value) {
    for (var i = 0; i < TRADES.length; i++) {
      if (TRADES[i][0] === value) return TRADES[i][1].toLowerCase();
    }
    return 'your trade';
  }

  return {
    site: 'grandstreetworks',
    homeHref: '../',
    /* Points at the intake service defined in render.yaml. Changing the
       Render service name changes this hostname. */
    endpoint: 'https://grandstreetworks-intake.onrender.com/submit',
    fallbackEmail: 'joe@grandstreetworks.com',
    fallbackSubject: 'A question about our setup',

    steps: [
      {
        id: 'url',
        type: 'url',
        eyebrow: 'Q_01 // The site you have',
        title: 'What\'s your website address?',
        help: 'The only one that matters for the rebuild. The rest is us working out whether the site is even the right thing to fix.',
        fieldLabel: 'Website',
        placeholder: 'yourfirm.com',
        summaryLabel: 'Website',
        skipLabel: 'We don\'t have one →',
        skipValue: 'none'
      },
      {
        id: 'trade',
        type: 'trades',
        eyebrow: 'Q_02 // The trade',
        title: 'What kind of business is it?',
        help: 'Pick the nearest one. We\'ve read the good against the bad in each of these, and close enough is close enough.',
        summaryLabel: 'Trade',
        options: TRADES.map(function (t) { return { value: t[0], label: t[1] }; })
      },
      {
        id: 'age',
        type: 'choice',
        eyebrow: 'Q_03 // Its age',
        title: 'When was that site last properly rebuilt?',
        help: 'Not when someone last changed the phone number. When it was last built from scratch.',
        summaryLabel: 'Site age',
        requiredMessage: 'A rough guess is fine.',
        options: [
          { value: 'new',     label: 'In the last two years',
            note: 'Recent enough that someone thought about the structure.',
            scores: { audit: 1 } },
          { value: 'mid',     label: 'Three to six years ago',
            note: 'Built before phones became most of the traffic.',
            scores: { website: 2 } },
          { value: 'old',     label: 'Longer than that, or nobody\'s sure',
            note: 'Whoever built it has usually moved on by now.',
            scores: { website: 3 } },
          { value: 'none',    label: 'We don\'t really have one',
            note: 'A directory listing, a social page, or a placeholder.',
            scores: { website: 4 } }
        ]
      },
      {
        id: 'pain',
        type: 'multi',
        max: 2,
        columns: 2,
        eyebrow: 'Q_04 // The leak',
        title: 'What\'s actually costing you money right now?',
        help: 'Up to two, biggest first. The order counts for more than you\'d think.',
        summaryLabel: 'Biggest problems',
        requiredMessage: 'Pick at least one, even if none of them is exactly it.',
        options: [
          { value: 'invisible', label: 'People don\'t find us, or they find us and don\'t call',
            note: 'The phone rings less than the work deserves.',
            scores: { website: 3 } },
          { value: 'outdated', label: 'The site looks nothing like the business we\'ve become',
            note: 'It undersells you to the person you most want to impress.',
            scores: { website: 3 } },
          { value: 'leaking', label: 'Enquiries come in and fall through the cracks',
            note: 'Nobody can say how many arrived last month, or how many booked.',
            scores: { systems: 3, website: 1 } },
          { value: 'followup', label: 'Follow-up happens when somebody remembers',
            note: 'Which, most months, is nobody.',
            scores: { systems: 3 } },
          { value: 'doubleentry', label: 'The same details get typed into three different systems',
            note: 'And by Friday the three of them disagree.',
            scores: { audit: 2, systems: 2 } },
          { value: 'field', label: 'The crew runs on paper, photos and group chats',
            note: 'Anything happening away from the office arrives late and half-legible.',
            scores: { app: 3, systems: 1 } },
          { value: 'software', label: 'We pay for software nobody has reviewed in years',
            note: 'At least one line costs more than a part-time salary.',
            scores: { audit: 3 } },
          { value: 'fine', label: 'Honestly? It\'s working. I\'m just having a look.',
            note: 'A reasonable answer, and we\'ll give you a straight one back.',
            scores: { none: 4 } }
        ]
      },
      {
        id: 'size',
        type: 'choice',
        eyebrow: 'Q_05 // The shape',
        title: 'How many people are there, including you?',
        help: 'Below a certain size most systems cost more attention than they give back.',
        summaryLabel: 'Headcount',
        requiredMessage: 'Roughly is fine.',
        options: [
          { value: 'solo',   label: 'Just me, or me and one other',
            scores: { website: 1 } },
          { value: 'small',  label: 'Two to ten',
            scores: { systems: 1 } },
          { value: 'mid',    label: 'Eleven to thirty',
            scores: { systems: 1, audit: 1 } },
          { value: 'large',  label: 'More than thirty',
            scores: { audit: 2, app: 1 } }
        ]
      },
      {
        id: 'result',
        type: 'result',
        eyebrow: 'Read // Based on those five answers',
        title: 'Here\'s what we\'d actually suggest.',
        help: 'The same logic we\'d use on a first call, which is why it can tell you to do nothing.'
      }
    ],

    /* Declaration order is the tie-break, so the honest "nothing" verdict
       sits first: a set of answers that scores nothing lands there rather
       than defaulting into a sales pitch. */
    services: {
      none: {
        terminal: true,
        kicker: 'Our read // Don\'t buy anything',
        headline: 'Nothing here is worth spending money on yet.',
        body: function () {
          return [
            'Nothing you told us describes a problem worth a project. A site that works and a week that isn\'t drowning is what most of our clients are paying to reach, and you\'re already there.',
            'Leave it alone until something specific starts hurting: enquiries you can\'t account for, a week where the admin beats the work, or a competitor whose site plainly outclasses yours in front of a client. Any of those is worth an email. None is worth a retainer today.',
            'Keep the address. We\'ll still answer.'
          ];
        }
      },
      website: {
        kicker: 'Our read // Start with the site',
        headline: 'The site is the thing to fix, and we\'ll rebuild it first.',
        body: function (a) {
          var trade = tradeLabel(a.trade);
          var out = [
            'What you described is structure, not taste. Before anything gets designed we pull the best and worst ' + trade + ' sites in your metro and read them the way a customer does: what every good one has on the page, and what none of the bad ones do. That read becomes the page.',
            'Your first answer gave us a URL, so this starts as the homepage rebuild: a real homepage for your business, plus the written read behind it, so your own developer could use it without us. No call, nothing to cancel.'
          ];
          if (a.size === 'solo') {
            out.push('At your size that is probably the whole job. A one or two person firm rarely needs the systems behind the site, and we\'d rather say so now than sell you one later.');
          }
          return out;
        },
        secondaryLine: 'Once the site sends more than you can track by hand, the system behind it is the next rung. Not before.',
        links: function (a) {
          if (!a.trade || a.trade === 'other') {
            return [{ label: 'See our builds →', href: '../#work' }];
          }
          return [{ label: 'See six ' + tradeLabel(a.trade) + ' builds →', href: '../work/' + a.trade + '/' }];
        }
      },
      systems: {
        kicker: 'Our read // The catching, not the getting',
        headline: 'You don\'t have a traffic problem. You have a catching problem.',
        body: function (a) {
          var out = [
            'Enquiries arriving and then evaporating is the most expensive failure on this list, because you have already paid for every one of them. A new site just adds volume to a bucket with a hole in it.',
            'What fixes it is the layer behind the site: every enquiry logged and attributed so you know what the site is worth, stale ones chased with the follow-up drafted for your approval, and one page showing where the pipeline, the schedule and the money stand. Running inside a week, on your accounts, with nothing given write access until you\'ve watched it work on drafts.'
          ];
          if (a.age === 'old' || a.age === 'none') {
            out.push('Your site is old enough to be costing you too, and we would still rebuild it first, but on your answers it is the second problem.');
          }
          return out;
        },
        secondaryLine: 'The homepage rebuild still stands alongside it.',
        links: function () {
          return [{ label: 'What that includes →', href: '../what-we-build/#services' }];
        }
      },
      app: {
        kicker: 'Our read // Off the desk',
        headline: 'The work leaves the building, so the software has to as well.',
        body: function () {
          return [
            'Paper, photos and a group chat is a system, just a bad one, and the reason job information arrives late and half-legible. When the job happens on a roof, in a unit or at two in the morning, that is the narrow case where an app earns its cost: photos, notes and signatures captured with no signal, synced when the truck has bars again, published under your own developer account.',
            'The caveat: most businesses that ask us for an app do not need one, and for them it is a more expensive way to have a website. We will tell you which one you are on the first call, before there is a deposit involved.'
          ];
        },
        secondaryLine: 'The back-office layer usually has to exist first. The app is the window onto it.',
        links: function () {
          return [{ label: 'What we won\'t build →', href: '../what-we-build/#services' }];
        }
      },
      audit: {
        kicker: 'Our read // Measure before building',
        headline: 'Buy the audit, not the build.',
        body: function () {
          return [
            'What you described is manual work and software spend, not a shortage of customers. Building anything before that is costed is how firms end up automating the third most expensive problem.',
            'The operations audit is a fixed fee, report inside five business days: a 60–90 minute walkthrough of how the business runs, your top five opportunities ranked by hours saved against effort with a price on each, a check of what you rent monthly and use a fifth of, and a "do not automate" list.',
            'The fee credits in full against anything you book in the next thirty days, and the report is yours to keep either way.'
          ];
        },
        secondaryLine: 'Whatever the audit ranks first is usually the back-office work, quoted fixed once there are numbers under it.',
        links: function () {
          return [{ label: 'What the audit covers →', href: '../what-we-build/#services' }];
        }
      }
    },

    /* Trade only ever nudges. It is never enough to change the verdict on
       its own — the work has to have been described as broken first. */
    adjust: function (totals, a) {
      if (FIELD_TRADES.indexOf(a.trade) > -1 && totals.app > 0) totals.app += 1;
      /* Somebody with no site at all cannot be sold a system that has
         nothing feeding it. */
      if (a.url === 'none' || a.age === 'none') totals.website += 1;
    },

    contact: {
      title: 'Want us to actually do it?',
      help: 'The read above is yours either way, and nothing gets sent unless you press the button. If you want it acted on, this is what we need.',
      submitLabel: 'Send this to Joe →',
      mailSubject: 'Grand Street Works intake',
      fields: [
        { name: 'name',     label: 'Your name',        required: true,  autocomplete: 'name',         placeholder: 'Jane Halloran' },
        { name: 'business', label: 'Business name',    required: true,  autocomplete: 'organization', placeholder: 'Halloran Roofing' },
        { name: 'email',    label: 'Email',            required: true,  inputType: 'email', autocomplete: 'email', placeholder: 'jane@halloranroofing.com' },
        { name: 'metro',    label: 'City or metro you work in', required: true, placeholder: 'Westchester County, NY' },
        { name: 'phone',    label: 'Phone',            required: false, inputType: 'tel', autocomplete: 'tel', placeholder: '(914) 555-0142' },
        { name: 'notes',    label: 'Anything the five questions missed', required: false, multiline: true, placeholder: 'Optional. The thing you\'d say out loud that didn\'t fit a checkbox.' }
      ],
      doneTitle: 'That\'s in. You\'ll hear back within a business day.',
      doneBody: 'A real reply from Joe, not an autoresponder, including if the answer is that we aren\'t what you need. If you asked for the rebuild, the link usually follows within the week.',
      doneLinks: [
        { label: 'See our builds →', href: '../#work' },
        { label: 'Back to the site →', href: '../' }
      ]
    }
  };
})();
</script>
<script src="intake.js"></script>
</body>
</html>
